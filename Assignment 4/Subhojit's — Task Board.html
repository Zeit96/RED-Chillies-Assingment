<!DOCTYPE html>

<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subhojit's — Task Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link href="./Subhojit&#39;s — Task Board_files/css2" rel="stylesheet">
<style>
  :root{
    --bg:#F3F1EC;
    --panel:#FFFFFF;
    --ink:#1C1D22;
    --ink-soft:#6B6D77;
    --line:#E4E1D8;
    --accent:#3B4A6B;
    --accent-soft:#EAEDF4;
    --high:#D8492E;
    --high-bg:#FBEAE6;
    --med:#C98A1F;
    --med-bg:#FBF1DF;
    --low:#2E7D8C;
    --low-bg:#E4F1F3;
    --overdue:#B23A2E;
    --radius:10px;
    --shadow: 0 1px 2px rgba(28,29,34,0.06), 0 6px 16px rgba(28,29,34,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:22px 28px;
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .brand .mark{
    width:12px;height:12px;
    background:var(--accent);
    border-radius:2px;
    display:inline-block;
    transform:translateY(1px);
  }
  .brand h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:20px;
    font-weight:700;
    margin:0;
    letter-spacing:-0.01em;
  }
  .brand span.sub{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:.08em;
  }
  .controls{
    display:flex;
    gap:10px;
    align-items:center;
    flex-wrap:wrap;
  }
  .search-wrap{
    position:relative;
  }
  .search-wrap input{
    font-family:'Inter',sans-serif;
    font-size:13px;
    padding:9px 12px 9px 32px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--panel);
    width:220px;
    outline:none;
    transition:border-color .15s;
  }
  .search-wrap input:focus{border-color:var(--accent);}
  .search-wrap::before{
    content:"";
    position:absolute;
    left:11px;top:50%;
    width:13px;height:13px;
    transform:translateY(-50%);
    background:var(--ink-soft);
    -webkit-mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M21 21l-4.35-4.35M18 11a7 7 0 1 1-14 0 7 7 0 0 1 14 0z" fill="none" stroke="black" stroke-width="2"/></svg>') no-repeat center;
    mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M21 21l-4.35-4.35M18 11a7 7 0 1 1-14 0 7 7 0 0 1 14 0z" fill="none" stroke="black" stroke-width="2"/></svg>') no-repeat center;
  }
  select#priorityFilter{
    font-family:'Inter',sans-serif;
    font-size:13px;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--panel);
    outline:none;
    color:var(--ink);
  }
  .btn-primary{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    background:var(--accent);
    color:#fff;
    border:none;
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer;
    transition:transform .12s, box-shadow .12s;
  }
  .btn-primary:hover{transform:translateY(-1px); box-shadow:var(--shadow);}

  .board{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:18px;
    padding:24px 28px 60px;
    align-items:start;
  }
  @media (max-width: 1000px){
    .board{grid-template-columns:repeat(2, 1fr);}
  }
  @media (max-width: 620px){
    .board{grid-template-columns:1fr;}
    .topbar{flex-direction:column; align-items:flex-start;}
    .search-wrap input{width:100%;}
  }

  .column{
    background:transparent;
    display:flex;
    flex-direction:column;
    min-height:120px;
  }
  .column-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:2px 4px 12px;
  }
  .column-head .label{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .dot{width:8px;height:8px;border-radius:50%;}
  .col-todo .dot{background:#8B8D97;}
  .col-inprogress .dot{background:var(--med);}
  .col-review .dot{background:var(--low);}
  .col-done .dot{background:#3F8E5B;}
  .column-head h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:13px;
    font-weight:600;
    letter-spacing:.04em;
    text-transform:uppercase;
    margin:0;
    color:var(--ink);
  }
  .count{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    background:var(--panel);
    border:1px solid var(--line);
    padding:2px 7px;
    border-radius:20px;
  }
  .dropzone{
    flex:1;
    min-height:80px;
    border-radius:12px;
    padding:4px;
    transition:background .15s;
  }
  .dropzone.drag-over{
    background:var(--accent-soft);
    outline:2px dashed var(--accent);
    outline-offset:-2px;
  }
  .empty-hint{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    text-align:center;
    padding:24px 8px;
    border:1px dashed var(--line);
    border-radius:10px;
    opacity:.7;
  }

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-left:4px solid var(--accent);
    border-radius:var(--radius);
    padding:12px 12px 12px 12px;
    margin-bottom:10px;
    box-shadow:var(--shadow);
    cursor:grab;
    transition:transform .12s, box-shadow .12s, opacity .12s;
  }
  .card:hover{transform:translateY(-2px);}
  .card.dragging{opacity:.4; cursor:grabbing;}
  .card.priority-High{border-left-color:var(--high);}
  .card.priority-Medium{border-left-color:var(--med);}
  .card.priority-Low{border-left-color:var(--low);}

  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
    margin-bottom:6px;
  }
  .card-id{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    color:var(--ink-soft);
  }
  .card h3{
    font-family:'Inter',sans-serif;
    font-size:14px;
    font-weight:600;
    margin:2px 0 4px;
    line-height:1.3;
  }
  .card p{
    font-size:12.5px;
    color:var(--ink-soft);
    margin:0 0 10px;
    line-height:1.4;
  }
  .card-foot{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:6px;
  }
  .tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    font-weight:500;
    padding:3px 8px;
    border-radius:20px;
    text-transform:uppercase;
    letter-spacing:.03em;
  }
  .tag.High{background:var(--high-bg); color:var(--high);}
  .tag.Medium{background:var(--med-bg); color:var(--med);}
  .tag.Low{background:var(--low-bg); color:var(--low);}
  .due{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--ink-soft);
  }
  .due.overdue{
    color:var(--overdue);
    font-weight:600;
  }
  .card-actions{
    display:flex;
    gap:6px;
    margin-top:8px;
    opacity:0;
    transition:opacity .12s;
  }
  .card:hover .card-actions{opacity:1;}
  .card-actions button{
    font-family:'Inter',sans-serif;
    font-size:11px;
    border:1px solid var(--line);
    background:var(--panel);
    padding:4px 9px;
    border-radius:6px;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .card-actions button:hover{color:var(--ink); border-color:var(--ink-soft);}

  /* Modal */
  .overlay{
    position:fixed; inset:0;
    background:rgba(28,29,34,0.45);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:20px;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--panel);
    border-radius:14px;
    width:100%;
    max-width:420px;
    padding:24px;
    box-shadow:0 20px 50px rgba(0,0,0,0.25);
  }
  .modal h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:17px;
    margin:0 0 18px;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:11px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .field input, .field textarea, .field select{
    width:100%;
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    outline:none;
    color:var(--ink);
    background:#fff;
  }
  .field input:focus, .field textarea:focus, .field select:focus{border-color:var(--accent);}
  .field textarea{resize:vertical; min-height:60px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:20px;
  }
  .btn-ghost{
    font-family:'Inter',sans-serif;
    font-size:13px;
    background:transparent;
    border:1px solid var(--line);
    padding:9px 15px;
    border-radius:8px;
    cursor:pointer;
    color:var(--ink-soft);
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="mark"></span>
    <div>
      <h1>Subhojit's</h1>
    </div>
    <span class="sub">Task Board</span>
  </div>
  <div class="controls">
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="Search tasks…">
    </div>
    <select id="priorityFilter">
      <option value="all">All priorities</option>
      <option value="High">High</option>
      <option value="Medium">Medium</option>
      <option value="Low">Low</option>
    </select>
    <button class="btn-primary" id="addTaskBtn">+ New Task</button>
  </div>
</div>

<div class="board" id="board">
  <div class="column col-todo" data-status="todo">
    <div class="column-head">
      <div class="label"><span class="dot"></span><h2>To Do</h2></div>
      <span class="count" id="count-todo">1</span>
    </div>
    <div class="dropzone" id="drop-todo"><div class="card priority-High" draggable="true" data-id="1">
          <div class="card-top">
            <span class="card-id">TSK-001</span>
          </div>
          <h3>Design homepage</h3>
          <p>Create wireframes</p>
          <div class="card-foot">
            <span class="tag High">High</span>
            
          </div>
          <div class="card-actions">
            <button type="button" data-action="edit">Edit</button>
            <button type="button" data-action="delete">Delete</button>
          </div>
        </div></div>
  </div>
  <div class="column col-inprogress" data-status="inprogress">
    <div class="column-head">
      <div class="label"><span class="dot"></span><h2>In Progress</h2></div>
      <span class="count" id="count-inprogress">1</span>
    </div>
    <div class="dropzone" id="drop-inprogress"><div class="card priority-Medium" draggable="true" data-id="2">
          <div class="card-top">
            <span class="card-id">TSK-002</span>
          </div>
          <h3>Setup CI/CD</h3>
          <p>GitHub Actions pipeline</p>
          <div class="card-foot">
            <span class="tag Medium">Medium</span>
            
          </div>
          <div class="card-actions">
            <button type="button" data-action="edit">Edit</button>
            <button type="button" data-action="delete">Delete</button>
          </div>
        </div></div>
  </div>
  <div class="column col-review" data-status="review">
    <div class="column-head">
      <div class="label"><span class="dot"></span><h2>Review</h2></div>
      <span class="count" id="count-review">1</span>
    </div>
    <div class="dropzone" id="drop-review"><div class="card priority-Low" draggable="true" data-id="3">
          <div class="card-top">
            <span class="card-id">TSK-003</span>
          </div>
          <h3>Write API docs</h3>
          <p>OpenAPI spec</p>
          <div class="card-foot">
            <span class="tag Low">Low</span>
            
          </div>
          <div class="card-actions">
            <button type="button" data-action="edit">Edit</button>
            <button type="button" data-action="delete">Delete</button>
          </div>
        </div></div>
  </div>
  <div class="column col-done" data-status="done">
    <div class="column-head">
      <div class="label"><span class="dot"></span><h2>Done</h2></div>
      <span class="count" id="count-done">1</span>
    </div>
    <div class="dropzone" id="drop-done"><div class="card priority-High" draggable="true" data-id="4">
          <div class="card-top">
            <span class="card-id">TSK-004</span>
          </div>
          <h3>Example Task</h3>
          <p>Red Chillies Assignment</p>
          <div class="card-foot">
            <span class="tag High">High</span>
            
          </div>
          <div class="card-actions">
            <button type="button" data-action="edit">Edit</button>
            <button type="button" data-action="delete">Delete</button>
          </div>
        </div></div>
  </div>
</div>

<!-- Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">New Task</h2>
    <form id="taskForm">
      <div class="field">
        <label>Title</label>
        <input type="text" id="fieldTitle" required="" maxlength="80">
      </div>
      <div class="field">
        <label>Description</label>
        <textarea id="fieldDesc" maxlength="240"></textarea>
      </div>
      <div class="row2">
        <div class="field">
          <label>Priority</label>
          <select id="fieldPriority">
            <option value="Low">Low</option>
            <option value="Medium" selected="">Medium</option>
            <option value="High">High</option>
          </select>
        </div>
        <div class="field">
          <label>Due date</label>
          <input type="date" id="fieldDue">
        </div>
      </div>
      <div class="field">
        <label>Status</label>
        <select id="fieldStatus">
          <option value="todo">To Do</option>
          <option value="inprogress">In Progress</option>
          <option value="review">Review</option>
          <option value="done">Done</option>
        </select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn-primary" id="saveBtn">Add Task</button>
      </div>
    </form>
  </div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'slate-kanban-tasks';
  const STATUSES = ['todo','inprogress','review','done'];

  const sampleData = [
    {id:1, title:"Design homepage", desc:"Create wireframes", priority:"High", status:"todo", due:""},
    {id:2, title:"Setup CI/CD", desc:"GitHub Actions pipeline", priority:"Medium", status:"inprogress", due:""},
    {id:3, title:"Write API docs", desc:"OpenAPI spec", priority:"Low", status:"review", due:""}
  ];

  let tasks = load();
  let editingId = null;
  let dragId = null;

  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return JSON.parse(JSON.stringify(sampleData));
  }
  function save(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  }
  function nextId(){
    return tasks.length ? Math.max(...tasks.map(t=>t.id)) + 1 : 1;
  }
  function isOverdue(task){
    if(!task.due || task.status === 'done') return false;
    const today = new Date(); today.setHours(0,0,0,0);
    const dueDate = new Date(task.due + 'T00:00:00');
    return dueDate < today;
  }
  function fmtDate(d){
    if(!d) return '';
    const dt = new Date(d + 'T00:00:00');
    return dt.toLocaleDateString(undefined, {month:'short', day:'numeric'});
  }

  function render(){
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    const pf = document.getElementById('priorityFilter').value;

    STATUSES.forEach(s=>{
      const zone = document.getElementById('drop-'+s);
      zone.innerHTML = '';
      const list = tasks.filter(t=>{
        if(t.status !== s) return false;
        if(pf !== 'all' && t.priority !== pf) return false;
        if(q && !(t.title.toLowerCase().includes(q) || (t.desc||'').toLowerCase().includes(q))) return false;
        return true;
      });
      document.getElementById('count-'+s).textContent = tasks.filter(t=>t.status===s).length;

      if(list.length === 0){
        const hint = document.createElement('div');
        hint.className = 'empty-hint';
        hint.textContent = q || pf!=='all' ? 'No matching tasks' : 'Drop tasks here';
        zone.appendChild(hint);
        return;
      }

      list.forEach(t=>{
        const card = document.createElement('div');
        card.className = 'card priority-' + t.priority;
        card.draggable = true;
        card.dataset.id = t.id;

        const overdue = isOverdue(t);
        card.innerHTML = `
          <div class="card-top">
            <span class="card-id">TSK-${String(t.id).padStart(3,'0')}</span>
          </div>
          <h3>${escapeHtml(t.title)}</h3>
          ${t.desc ? `<p>${escapeHtml(t.desc)}</p>` : ''}
          <div class="card-foot">
            <span class="tag ${t.priority}">${t.priority}</span>
            ${t.due ? `<span class="due ${overdue?'overdue':''}">${overdue?'⚠ Overdue · ':''}${fmtDate(t.due)}</span>` : ''}
          </div>
          <div class="card-actions">
            <button type="button" data-action="edit">Edit</button>
            <button type="button" data-action="delete">Delete</button>
          </div>
        `;

        card.addEventListener('dragstart', e=>{
          dragId = t.id;
          card.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });
        card.addEventListener('dragend', ()=> card.classList.remove('dragging'));

        card.querySelector('[data-action="edit"]').addEventListener('click', ()=> openModal(t.id));
        card.querySelector('[data-action="delete"]').addEventListener('click', ()=>{
          tasks = tasks.filter(x=>x.id !== t.id);
          save(); render();
        });

        zone.appendChild(card);
      });
    });
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // Drag & drop zones
  STATUSES.forEach(s=>{
    const zone = document.getElementById('drop-'+s);
    zone.addEventListener('dragover', e=>{
      e.preventDefault();
      zone.classList.add('drag-over');
    });
    zone.addEventListener('dragleave', ()=> zone.classList.remove('drag-over'));
    zone.addEventListener('drop', e=>{
      e.preventDefault();
      zone.classList.remove('drag-over');
      const task = tasks.find(t=>t.id === dragId);
      if(task){
        task.status = s;
        save(); render();
      }
    });
  });

  // Modal logic
  const overlay = document.getElementById('overlay');
  const form = document.getElementById('taskForm');

  function openModal(id){
    editingId = id || null;
    const isEdit = !!id;
    document.getElementById('modalTitle').textContent = isEdit ? 'Edit Task' : 'New Task';
    document.getElementById('saveBtn').textContent = isEdit ? 'Save Changes' : 'Add Task';

    if(isEdit){
      const t = tasks.find(x=>x.id === id);
      document.getElementById('fieldTitle').value = t.title;
      document.getElementById('fieldDesc').value = t.desc || '';
      document.getElementById('fieldPriority').value = t.priority;
      document.getElementById('fieldDue').value = t.due || '';
      document.getElementById('fieldStatus').value = t.status;
    } else {
      form.reset();
      document.getElementById('fieldPriority').value = 'Medium';
      document.getElementById('fieldStatus').value = 'todo';
    }
    overlay.classList.add('open');
    document.getElementById('fieldTitle').focus();
  }
  function closeModal(){
    overlay.classList.remove('open');
    editingId = null;
  }

  document.getElementById('addTaskBtn').addEventListener('click', ()=> openModal(null));
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  overlay.addEventListener('click', e=>{ if(e.target === overlay) closeModal(); });

  form.addEventListener('submit', e=>{
    e.preventDefault();
    const title = document.getElementById('fieldTitle').value.trim();
    if(!title) return;
    const data = {
      title,
      desc: document.getElementById('fieldDesc').value.trim(),
      priority: document.getElementById('fieldPriority').value,
      due: document.getElementById('fieldDue').value,
      status: document.getElementById('fieldStatus').value
    };
    if(editingId){
      const t = tasks.find(x=>x.id === editingId);
      Object.assign(t, data);
    } else {
      tasks.push(Object.assign({id: nextId()}, data));
    }
    save(); closeModal(); render();
  });

  document.getElementById('searchInput').addEventListener('input', render);
  document.getElementById('priorityFilter').addEventListener('change', render);

  save();
  render();
})();
</script>


</body></html>
